# Build + push the public vLLM+Alloy image to THIS project's own Container
# Registry. The job token ($CI_REGISTRY_USER / $CI_REGISTRY_PASSWORD) already
# has write_registry to its own project, so no cross-project deploy token is
# needed.
#
# Tagging is git-tag deterministic: pushing a git tag (e.g. v0.11.0-alloy1.16.2-1)
# builds and publishes an image with that exact tag. The webapp pins one such
# immutable tag. NEVER re-push the same tag — Gcore does not re-pull an
# unchanged tag; cut a new git tag (bump the trailing counter) instead.
#
# `latest` is also pushed as a convenience pointer; never reference it from the
# webapp default (it is mutable).

stages:
  - build

build-and-push:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: "$CI_REGISTRY_IMAGE/vllm-alloy"
  rules:
    # Only build on annotated git tags — the tag name becomes the image tag.
    - if: '$CI_COMMIT_TAG'
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE:$CI_COMMIT_TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_TAG"
    - docker push "$IMAGE:latest"
